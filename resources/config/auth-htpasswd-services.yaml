imports:
    - auth-services.yaml

parameters:
    env(AUTH_HTPASSWD_LOGIN_MAX_ATTEMPTS): '5'
    env(AUTH_HTPASSWD_LOGIN_LOCK_SECONDS): '900'

    # The pages that this provider sends the user to: the login is a page of the
    # site.
    env(AUTH_WEB_LOGIN_REDIRECT_PATH): '/'
    env(AUTH_WEB_LOGOUT_REDIRECT_PATH): '/auth/login'
    env(AUTH_WEB_UNAUTHORIZED_REDIRECT_PATH): '/auth/login'

services:

    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # What the htpasswd file gives to the web channel: the login with a form, and
    # its session.
    Derafu\Auth\Contract\SessionManagerInterface:
        class: Derafu\Auth\Authentication\Channel\Web\SessionManager
        lazy: true
    Derafu\Auth\Contract\FormManagerInterface:
        class: Derafu\Auth\Authentication\Channel\Web\FormManager
        lazy: true
        arguments:
            $configuration: '@Derafu\Auth\Provider\Htpasswd\HtpasswdConfiguration'
    Derafu\Auth\Contract\WebFlowInterface:
        class: Derafu\Auth\Provider\Htpasswd\Web\HtpasswdWebFlow
        lazy: true

    # What the htpasswd file gives to the API channel: `Basic`, the user and the
    # password of the client.
    Derafu\Auth\Contract\ApiSchemeInterface:
        class: Derafu\Auth\Provider\Htpasswd\Api\HtpasswdBasicScheme
        lazy: true

    # Limits the failed attempts to log in, in the form and in `Basic`. It keeps
    # the counts in the PSR-6 pool of the application
    # (Psr\Cache\CacheItemPoolInterface), so the application must have one.
    Derafu\Auth\Authentication\LoginThrottle:
        lazy: true
        arguments:
            $maxAttempts: '%env(int:AUTH_HTPASSWD_LOGIN_MAX_ATTEMPTS)%'
            $lockSeconds: '%env(int:AUTH_HTPASSWD_LOGIN_LOCK_SECONDS)%'

    Derafu\Auth\Provider\Htpasswd\HtpasswdUserRepository:
        lazy: true
    Derafu\Auth\Provider\Htpasswd\HtpasswdConfiguration:
        lazy: true
        arguments:
            $config:
                htpasswd_path: '%env(default::string:AUTH_HTPASSWD_PATH)%'
                project_dir: '%kernel.project_dir%' # For replacing %kernel.project_dir% in the path.

    # Htpasswd controller.
    Derafu\Auth\Provider\Htpasswd\Web\HtpasswdController:
        public: true
