imports:
    - auth-services.yaml

parameters:
    # The database of the provider is the one of the application (DATABASE_URL)
    # unless AUTH_DATABASE_URL says another.
    auth.database.url.fallback: '%env(default::string:DATABASE_URL)%'

    env(AUTH_DATABASE_LOGIN_MAX_ATTEMPTS): '5'
    env(AUTH_DATABASE_LOGIN_LOCK_SECONDS): '900'

    # The pages that this provider sends the user to: the login is a page of the
    # site.
    env(AUTH_WEB_LOGIN_REDIRECT_PATH): '/'
    env(AUTH_WEB_LOGOUT_REDIRECT_PATH): '/auth/login'
    env(AUTH_WEB_UNAUTHORIZED_REDIRECT_PATH): '/auth/login'

services:

    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # What the database gives to the web channel: the login with a form, and its
    # session.
    Derafu\Auth\Contract\SessionManagerInterface:
        class: Derafu\Auth\Authentication\Channel\Web\SessionManager
        lazy: true
    Derafu\Auth\Contract\FormManagerInterface:
        class: Derafu\Auth\Authentication\Channel\Web\FormManager
        lazy: true
        arguments:
            $configuration: '@Derafu\Auth\Provider\Database\DatabaseConfiguration'
    Derafu\Auth\Contract\WebFlowInterface:
        class: Derafu\Auth\Provider\Database\Web\DatabaseWebFlow
        lazy: true

    # What the database gives to the API channel: `Basic`, the user and the
    # password of the client.
    Derafu\Auth\Contract\ApiSchemeInterface:
        class: Derafu\Auth\Provider\Database\Api\DatabaseBasicScheme
        lazy: true

    # Limits the failed attempts to log in, in the form and in `Basic`. It keeps
    # the counts in the PSR-6 pool of the application
    # (Psr\Cache\CacheItemPoolInterface), so the application must have one.
    Derafu\Auth\Authentication\LoginThrottle:
        lazy: true
        arguments:
            $maxAttempts: '%env(int:AUTH_DATABASE_LOGIN_MAX_ATTEMPTS)%'
            $lockSeconds: '%env(int:AUTH_DATABASE_LOGIN_LOCK_SECONDS)%'

    Derafu\Auth\Provider\Database\DatabaseUserRepository:
        lazy: true
    Derafu\Auth\Provider\Database\DatabaseConfiguration:
        lazy: true
        arguments:
            $config:
                database_url: '%env(default:auth.database.url.fallback:string:AUTH_DATABASE_URL)%'
                project_dir: '%kernel.project_dir%' # For replacing %kernel.project_dir% in the database URL (useful with SQLite).
                user_repository:
                    table: '%env(default::string:AUTH_DATABASE_USER_TABLE)%'
                    field:
                        identity: '%env(default::string:AUTH_DATABASE_USER_FIELD_IDENTITY)%'
                        password: '%env(default::string:AUTH_DATABASE_USER_FIELD_PASSWORD)%'
                        active: '%env(default::string:AUTH_DATABASE_USER_FIELD_ACTIVE)%'
                    sql_get_roles: '%env(default::string:AUTH_DATABASE_USER_SQL_GET_ROLES)%'
                    sql_get_details: '%env(default::string:AUTH_DATABASE_USER_SQL_GET_DETAILS)%'
                    sql_is_active: '%env(default::string:AUTH_DATABASE_USER_SQL_IS_ACTIVE)%'

    # Database controller.
    Derafu\Auth\Provider\Database\Web\DatabaseController:
        public: true
